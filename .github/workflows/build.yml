name: Build ArgonGram APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1
        with:
          filename: buildozer.spec
        env:
          ANDROID_API: "33"
          ANDROID_NDK: "25b"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArgonGram-APK
          path: bin/*.apk
          
