name: Build ArgonGram APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            /home/runner/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('sdt.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good libffi-dev libssl-dev autoconf libtool libtool-bin libltdl-dev pkg-config unzip ant openjdk-17-jdk zip automake cmake lld patch ccache

      - name: Setup Android SDK and Accept Licenses
        run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR/cmdline-tools
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip -d temp_tools
            mkdir -p $SDK_DIR/cmdline-tools/latest
            mv temp_tools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
            rm -rf cmdline-tools.zip temp_tools
          fi
          ln -sfn $SDK_DIR/cmdline-tools/latest $SDK_DIR/tools
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "platforms;android-33" "build-tools;33.0.2" "build-tools;37.0.0" || true

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython==0.29.36" wheel "setuptools<70.0.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArgonGram-APK
          path: bin/*.apk
          
